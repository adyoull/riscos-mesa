# Runs riscos-mesa's host tests (tests/run-all.sh) on every push and pull
# request: Mesa's rendering and speed checks, EGL, SDL, OpenAL, freeglut,
# the devkit examples and the VideoOverlay tests, all on Linux against a
# stand-in RISC OS. No RISC OS toolchain is needed. The patched sources
# and the host Mesa build are cached between runs.
name: host tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    # 24.04's GCC 13.3 is the compiler tests/host-harness/mesa/expected/perf.txt
    # was measured with (the speed check counts instructions).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3-mako \
            bison flex autoconf automake libtool cmake git curl valgrind zlib1g-dev

      - name: Cache the sources and the host Mesa build
        uses: actions/cache@v4
        with:
          path: src
          key: host-src-${{ hashFiles('build/env.sh', 'build/build-*.sh', 'patches/**', 'tests/host-setup.sh') }}

      - name: Prepare (sources, host Mesa, host GLU)
        run: tests/host-setup.sh

      - name: Run the host tests
        run: tests/run-all.sh

      - name: Keep the logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-logs
          path: |
            /tmp/riscos-mesa-tests/**/*.log
            src/*.log
